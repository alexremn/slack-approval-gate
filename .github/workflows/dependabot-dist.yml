name: Rebuild dist for Dependabot

# Dependabot bumps the lockfile but cannot rebuild the committed bundle, so
# its PRs for bundled dependencies fail CI's dist check. This rebuilds dist/
# and pushes it to the PR branch. The push is made with GITHUB_TOKEN, so CI on
# the new commit waits for "Approve workflows to run" in the PR merge box.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # Runs the updated dependencies' install scripts, so it gets no write
    # access and no persisted credentials.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check whether dist/ changed
        id: diff
        run: |
          if git diff --quiet -- dist/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload rebuilt dist
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/index.js
          retention-days: 1

  push:
    # Has write access but never runs repository or dependency code.
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download rebuilt dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Commit and push
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/index.js
          git commit -m "chore(deps): rebuild dist"
          # Not forced: if Dependabot updated the branch meanwhile, this fails
          # and the run for the new head rebuilds instead.
          git push origin "HEAD:refs/heads/${HEAD_REF}"
