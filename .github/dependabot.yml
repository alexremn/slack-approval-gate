version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    ignore:
      # TypeScript 7 ships only the native tsc binary with no JS compiler API;
      # ts-jest and ncc's ts-loader cannot load it. Lift once ts-jest supports >=7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Keep @types/node on the action runtime major (node24 in action.yml).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @actions/core 3.x is ESM-only ("type": "module", exports map has no
      # "require" condition), so the CommonJS jest/ts-jest suite cannot resolve
      # it. Lift once src/ and the test setup move to ESM.
      - dependency-name: "@actions/core"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
